openapi: 3.1.0
info:
  title: CodePromptMaker API
  description: API for generating, managing, and retrieving Prompt Contracts for Claude Code.
  version: 3.0.0
  contact:
    name: CodePromptMaker
    url: https://codepromptmaker.com

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://codepromptmaker.com
    description: Production

security:
  - bearerAuth: []
  - sessionAuth: []

paths:
  /api/generate:
    post:
      summary: Generate a Prompt Contract
      description: >
        Takes a natural language description and generates a structured Prompt Contract
        using Claude API. Optionally uses a Developer Profile for context injection.
        The generated prompt is automatically persisted to the database.
      operationId: generatePromptContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePromptInput'
      responses:
        '200':
          description: Prompt Contract generated and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratePromptResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error (e.g. missing API key, Claude API failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/prompts:
    get:
      summary: List all prompts
      description: Returns all saved Prompt Contracts ordered by creation date (newest first), with tags. Scoped to the authenticated user.
      operationId: listPrompts
      responses:
        '200':
          description: Array of prompts with tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromptWithTags'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/prompts/{id}:
    get:
      summary: Get a prompt by ID
      description: Returns a single Prompt Contract with its tags. Scoped to the authenticated user.
      operationId: getPromptById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prompt found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptWithTags'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update prompt rating or notes
      description: Partially updates a prompt's rating and/or notes fields.
      operationId: updatePrompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePromptInput'
      responses:
        '200':
          description: Updated prompt with tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptWithTags'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a prompt
      description: Deletes a Prompt Contract and its associated tags.
      operationId: deletePrompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prompt deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/prompts/search:
    get:
      summary: Semantic search over prompts
      description: >
        Embeds the query text and returns prompts ranked by semantic similarity.
        Requires at least 3 characters. Uses the configured embedding provider.
      operationId: searchPrompts
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
          description: Search query text
      responses:
        '200':
          description: Ranked search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
        '400':
          description: Query too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/prompts/backfill:
    post:
      summary: Backfill embeddings for prompts without them
      description: >
        Finds all prompts that lack embeddings and generates them sequentially.
        Useful after first enabling RAG or after switching embedding providers.
      operationId: backfillEmbeddings
      responses:
        '200':
          description: Backfill results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profile:
    get:
      summary: Get developer profile
      description: Returns the current developer profile for the authenticated user, or null if none exists.
      operationId: getProfile
      responses:
        '200':
          description: Profile found or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DeveloperProfile'
                  - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Create or update developer profile
      description: >
        Creates a new profile if none exists for the authenticated user, or updates the existing one.
      operationId: upsertProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperProfile'
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperProfile'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/tokens:
    get:
      summary: List API tokens
      description: Returns all API tokens for the authenticated user, with hashes masked.
      operationId: listApiTokens
      responses:
        '200':
          description: Array of token metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiTokenMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create an API token
      description: >
        Generates a new API token. The plaintext token is returned exactly once
        in the response and is never stored.
      operationId: createApiToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Descriptive name for the token
                  example: CLI access
      responses:
        '201':
          description: Token created (plaintext returned once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '400':
          description: Token name is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/tokens/{id}:
    delete:
      summary: Delete an API token
      description: Deletes an API token by ID. Scoped to the authenticated user.
      operationId: deleteApiToken
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects:
    get:
      summary: List projects for an organization
      description: Returns all projects for the specified organization. Requires membership in the org.
      operationId: listProjects
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Organization ID to list projects for
      responses:
        '200':
          description: Array of projects with prompt counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectWithCount'
        '400':
          description: orgId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a project
      description: >
        Creates a new project within an organization. Slug is auto-generated from the
        project name with deduplication within the org. Requires membership in the org.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  slug:
                    type: string
                  orgId:
                    type: string
                    format: uuid
        '400':
          description: Validation failed (missing orgId or name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}:
    get:
      summary: Get a project by ID
      description: Returns a single project with prompt count. Membership in the project's org is required.
      operationId: getProjectById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWithCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a project
      description: Updates project name, description, machine size, or region. Requires owner or admin role in the org.
      operationId: updateProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInput'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  slug:
                    type: string
                  description:
                    type: string
                    nullable: true
                  machineSize:
                    type: string
                  region:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
        '400':
          description: Validation failed (empty name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Requires owner or admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a project
      description: >
        Deletes a project. Prompts linked to this project get project_id set to NULL
        (not cascade-deleted). Requires owner role in the org.
      operationId: deleteProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Requires owner role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/runner:
    get:
      summary: Get runner status (stub)
      description: Not yet implemented. Will return runner session status in v4.
      operationId: getRunnerStatus
      responses:
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Start runner session (stub)
      description: Not yet implemented. Will trigger a runner session in v4.
      operationId: startRunner
      responses:
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token (cpm_...) for CLI and programmatic access
    sessionAuth:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Browser session cookie (set by NextAuth.js)

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized

  schemas:
    GeneratePromptInput:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          minLength: 10
          description: Natural language description of the task
          example: Add dark mode toggle to the settings page
        profileId:
          type: string
          format: uuid
          description: Optional developer profile ID for context injection
        language:
          type: string
          enum: [en, da]
          description: Output language (defaults to profile setting or 'en')
        tags:
          type: array
          items:
            type: string
          description: Optional tags for categorization
          example: [ui, feature]

    GeneratePromptResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        goal:
          type: string
        constraints:
          type: string
        format:
          type: string
        failureConditions:
          type: string
        fullPrompt:
          type: string
          description: Complete Prompt Contract with CLAUDE.md handshake prepended
        language:
          type: string
          enum: [en, da]
        tags:
          type: array
          items:
            type: string
        tokensUsed:
          type: integer
          description: Total tokens consumed (input + output)
        model:
          type: string
          description: Claude model used
          example: claude-sonnet-4-20250514
        createdAt:
          type: string
          format: date-time
        similarPrompts:
          type: array
          description: Similar past prompts found via RAG (v2)
          items:
            $ref: '#/components/schemas/SimilarPromptRef'

    SimilarPromptRef:
      type: object
      properties:
        promptId:
          type: string
          format: uuid
        similarity:
          type: number
          format: float
          minimum: 0
          maximum: 1

    PromptWithTags:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        goal:
          type: string
        constraints:
          type: string
        format:
          type: string
        failureConditions:
          type: string
        fullPrompt:
          type: string
        language:
          type: string
          enum: [en, da]
        profileId:
          type: string
          format: uuid
          nullable: true
        embedding:
          type: string
          nullable: true
          description: Reserved for v2 RAG embeddings
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: User quality rating (1-5)
        notes:
          type: string
          nullable: true
          description: User notes on prompt performance
        tags:
          type: array
          items:
            type: string

    UpdatePromptInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Quality rating (1-5), or null to clear
        notes:
          type: string
          nullable: true
          description: User notes, or null to clear

    DeveloperProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        stack:
          type: array
          items:
            type: string
          example: [Next.js 16, React 19, TypeScript]
        hardRules:
          type: array
          items:
            type: string
        patterns:
          type: array
          items:
            type: string
        defaultFailureConditions:
          type: array
          items:
            type: string
        promptLanguage:
          type: string
          enum: [en, da]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        stack:
          type: array
          items:
            type: string
        hardRules:
          type: array
          items:
            type: string
        patterns:
          type: array
          items:
            type: string
        defaultFailureConditions:
          type: array
          items:
            type: string
        promptLanguage:
          type: string
          enum: [en, da]

    ApiTokenMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ApiTokenCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Plaintext API token (shown only once)
          example: cpm_a1b2c3d4e5f6...
        createdAt:
          type: string
          format: date-time

    SearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        similarity:
          type: number
          format: float
          minimum: 0
          maximum: 1

    BackfillResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total prompts that needed embeddings
        processed:
          type: integer
          description: Successfully embedded count
        errors:
          type: array
          description: Errors encountered during backfill (only present if errors occurred)
          items:
            type: object
            properties:
              id:
                type: string
              error:
                type: string

    Error:
      type: object
      properties:
        error:
          type: string

    ProjectWithCount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        machineSize:
          type: string
          enum: [free, micro, small, medium, large, xl]
          description: Fly.io machine size tier
        region:
          type: string
          enum: [iad, lax, ams, fra, arn, lhr, sin, gru]
          description: Fly.io deployment region
        status:
          type: string
          enum: [active, paused, deleted]
          description: Project status
        promptCount:
          type: integer
          description: Number of prompts in this project
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProjectInput:
      type: object
      required:
        - orgId
        - name
      properties:
        orgId:
          type: string
          format: uuid
          description: Organization to create the project in
        name:
          type: string
          minLength: 1
          description: Project name
          example: My Awesome App
        description:
          type: string
          description: Optional project description
        machineSize:
          type: string
          enum: [free, micro, small, medium, large, xl]
          default: free
          description: Fly.io machine size tier
        region:
          type: string
          enum: [iad, lax, ams, fra, arn, lhr, sin, gru]
          default: iad
          description: Fly.io deployment region

    UpdateProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New project name (slug is regenerated)
        description:
          type: string
          nullable: true
          description: New description, or null to clear
        machineSize:
          type: string
          enum: [free, micro, small, medium, large, xl]
          description: New machine size tier
        region:
          type: string
          enum: [iad, lax, ams, fra, arn, lhr, sin, gru]
          description: New deployment region

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: object
          description: Flattened Zod validation errors
